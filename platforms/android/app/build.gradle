plugins {
    id 'com.android.application'
}

def partyboardRepoDir = rootProject.projectDir.parentFile.parentFile
def partyboardGeneratedAssetsDir = layout.buildDirectory.dir('generated/assets/partyboard').get().asFile
def syncPartyBoardAssets = tasks.register('syncPartyBoardAssets', Sync) {
    from(new File(partyboardRepoDir, 'res')) {
        into 'res'
        exclude '**/.DS_Store'
    }
    // Shader pipelines seen on PC, which Aurora compiles before the first frame
    // instead of dropping draws on a scene's first visit. Desktop installs it
    // next to the binary; here Aurora reads it from the assets through SDL.
    from(new File(partyboardRepoDir, 'initial_pipeline_cache.db'))
    into partyboardGeneratedAssetsDir
}

android {
    namespace 'com.mariopartyrd.partyboard'
    compileSdk 36
    ndkVersion System.getenv('ANDROID_NDK_VERSION') ?: '29.0.14206865'

    defaultConfig {
        applicationId 'com.mariopartyrd.partyboard'
        minSdk 26
        targetSdk 36
        // CI passes its run number so each build installs over the last one.
        versionCode((System.getenv('PARTYBOARD_VERSION_CODE') ?: '1').toInteger())
        versionName '0.1.0'

        // libpartyboard_quest.so (Meta Quest), for the ABIs the game ships.
        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a', 'x86_64'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    // The Meta Quest headset side (src/main/cpp). The game's own libraries
    // come prebuilt from the CMake presets through jniLibs.
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab true
    }

    // The public test key CI signs with: a local debug build and a CI build
    // then install over each other without losing saves. Not a release key.
    signingConfigs {
        partyboardTest {
            storeFile file('../partyboard-test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    // Two APKs from the same code: `phone` asks for no install permission (Play
    // Protect holds that against an app); `quest` does, so a headset, which has
    // no installer of its own, installs its updates itself (quest/QuestUpdater).
    // Both run on either device; each follows its own update manifest.
    flavorDimensions 'device'
    productFlavors {
        phone {
            dimension 'device'
        }
        quest {
            dimension 'device'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.partyboardTest
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = [partyboardGeneratedAssetsDir]
        }
    }

    androidResources {
        // SQLite seeks all over the file; a compressed asset has to be
        // inflated again from the start on every backward seek.
        noCompress 'db'
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    lint {
        abortOnError false
    }

    testOptions {
        // Lobby code logs through android.util only on paths the tests do not take.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Khronos OpenXR loader: finds the headset's runtime (Meta Quest).
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
    // The online lobby's protocol (src/test): the PC companion's Tests.cs, for the phone.
    testImplementation 'junit:junit:4.13.2'
    // CubeShelf's QR code (CubeShelfLink.java): Play services shows the viewfinder itself, so the
    // app asks for no camera permission.
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}

tasks.configureEach { task ->
    if ((task.name.startsWith('merge') && task.name.endsWith('Assets')) ||
        task.name.toLowerCase().contains('lint')) {
        task.dependsOn(syncPartyBoardAssets)
    }
}
