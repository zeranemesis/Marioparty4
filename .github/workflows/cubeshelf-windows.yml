name: CubeShelf Desktop Release

on:
  push:
    branches:
      - audio-local
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cubeshelf-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: PartyBoard Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply PartyBoard dependency patches
        shell: pwsh
        run: |
          git -C extern/musyx apply --check ../../patches/musyx-partyboard.patch
          git -C extern/musyx apply ../../patches/musyx-partyboard.patch
          git -C extern/aurora apply --check ../../patches/aurora-partyboard.patch
          git -C extern/aurora apply ../../patches/aurora-partyboard.patch

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Override VCPKG_ROOT
        shell: pwsh
        run: |
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install ninja -y
          vcpkg install freetype:x64-windows-static zstd:x64-windows-static

      - name: Configure
        shell: pwsh
        run: cmake --preset x-windows-ci-msvc -DPARTYBOARD_EXPERIMENTAL_MUSYX_AUDIO=ON

      - name: Validate audio configuration
        shell: pwsh
        run: |
          $audio = Select-String -Path "build/x-windows-ci-msvc/CMakeCache.txt" `
            -Pattern '^PARTYBOARD_EXPERIMENTAL_MUSYX_AUDIO:BOOL=ON$'
          if (-not $audio) {
            throw "CubeShelf build was configured with the silent audio backend."
          }

      - name: Build
        shell: pwsh
        run: cmake --build --preset x-windows-ci-msvc

      - name: Build online launcher
        shell: pwsh
        run: |
          ./tools/build_online.ps1 -OutputDirectory "build/install"
          Copy-Item -LiteralPath "tools/package/Jouer en ligne.cmd" -Destination "build/install" -Force
          Copy-Item -LiteralPath "tools/package/Lancer PartyBoard.cmd" -Destination "build/install" -Force

      - name: Validate Windows runtime
        shell: pwsh
        run: |
          foreach ($file in @(
            "partyboard.exe",
            "PartyBoardOnline.exe",
            "PartyBoardOnline.exe.config",
            "Jouer en ligne.cmd",
            "Lancer PartyBoard.cmd"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path "build/install" $file) -PathType Leaf)) {
              throw "$file was not produced under build/install."
            }
          }

          $test = Start-Process -FilePath "build/install/PartyBoardOnline.exe" `
            -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow

          if ($test.ExitCode -ne 0) {
            throw "PartyBoardOnline self-test failed with exit code $($test.ExitCode)."
          }

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/install/*" `
            -DestinationPath "PartyBoard-win-x64.zip" `
            -Force

      - uses: actions/upload-artifact@v7
        with:
          name: cubeshelf-partyboard-win-x64
          path: PartyBoard-win-x64.zip
          retention-days: 14

  linux:
    name: PartyBoard Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            ninja-build clang lld openssl libcurl4-openssl-dev \
            zlib1g-dev libglu1-mesa-dev libdbus-1-dev libvulkan-dev \
            libxi-dev libxrandr-dev libasound2-dev libpulse-dev libudev-dev \
            libpng-dev libncurses5-dev libx11-xcb-dev libfreetype-dev \
            libxinerama-dev libxcursor-dev python3-markupsafe libgtk-3-dev \
            libssl-dev libxss-dev libfuse2 libusb-1.0-0-dev libdecor-0-dev \
            libpipewire-0.3-dev libunwind-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure
        run: cmake --preset x-linux-ci-gcc

      - name: Build
        run: cmake --build --preset x-linux-ci-gcc

      - name: Build AppImage
        run: ci/build-appimage.sh

      - name: Standardize Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find build/install -maxdepth 1 -type f -name 'Party_Board-*.AppImage' | head -n 1)"
          test -n "$appimage"
          cp "$appimage" PartyBoard-linux-x64.AppImage
          chmod +x PartyBoard-linux-x64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: cubeshelf-partyboard-linux-x64
          path: PartyBoard-linux-x64.AppImage
          retention-days: 14

  macos:
    name: PartyBoard macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            preset: x-macos-ci-arm64
            asset: PartyBoard-macos-arm64.zip
          - runner: macos-15-intel
            arch: x64
            preset: x-macos-ci-x86_64
            asset: PartyBoard-macos-x64.zip

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Install Rust x86_64 target
        if: matrix.arch == 'x64'
        run: |
          rustup toolchain install stable
          rustup target add x86_64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Validate app bundle
        shell: bash
        run: |
          test -d build/install/PartyBoard.app
          test -f build/install/PartyBoard.app/Contents/Info.plist

      - name: Package app bundle
        shell: bash
        run: |
          ditto \
            -c -k \
            --sequesterRsrc \
            --keepParent \
            build/install/PartyBoard.app \
            "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: cubeshelf-partyboard-macos-${{ matrix.arch }}
          path: ${{ matrix.asset }}
          retention-days: 14

  publish:
    name: Publish CubeShelf PartyBoard release
    needs:
      - windows
      - linux
      - macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: cubeshelf-partyboard-*
          path: release
          merge-multiple: true

      - name: Generate schema-2 manifest/checksums
        shell: python
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release")

          artifacts = {
              "win-x64": {
                  "name": "PartyBoard-win-x64.zip",
                  "kind": "zip",
                  "launch": "partyboard.exe",
              },
              "linux-x64": {
                  "name": "PartyBoard-linux-x64.AppImage",
                  "kind": "appimage",
                  "launch": "PartyBoard-linux-x64.AppImage",
              },
              "osx-arm64": {
                  "name": "PartyBoard-macos-arm64.zip",
                  "kind": "app-bundle-zip",
                  "launch": "PartyBoard.app",
              },
              "osx-x64": {
                  "name": "PartyBoard-macos-x64.zip",
                  "kind": "app-bundle-zip",
                  "launch": "PartyBoard.app",
              },
          }

          checksum_lines = []

          for rid, item in artifacts.items():
              path = root / item["name"]
              if not path.is_file():
                  raise SystemExit(f"Missing release asset: {path}")

              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              item["sha256"] = digest
              item["size"] = path.stat().st_size
              checksum_lines.append(f"{digest}  {item['name']}")

          sha = os.environ["COMMIT_SHA"]

          manifest = {
              "schema": 2,
              "game": "Mario Party 4",
              "gameId": "GMPE01_00",
              "version": f"nightly-{sha[:12]}",
              "commit": sha,
              "branch": os.environ["BRANCH_NAME"],
              "supportedDiscs": [
                  "GMPE01_00",
                  "GMPE01_01"
              ],
              "artifacts": artifacts,
          }

          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8")

          (root / "checksums.txt").write_text(
              "\n".join(checksum_lines) + "\n",
              encoding="ascii")

      - name: Generate release notes
        shell: bash
        run: |
          {
            echo "CubeShelf automatic PartyBoard desktop build"
            echo
            echo "Commit: ${{ github.sha }}"
            echo "Branch: ${{ github.ref_name }}"
            echo
            echo "Desktop packages:"
            echo "- Windows x64"
            echo "- Linux x64 AppImage"
            echo "- macOS Apple Silicon"
            echo "- macOS Intel"
            echo
            echo "Recent changes:"
            git log -5 --pretty=format:'- %h %s'
          } > release/release-notes.txt

      - name: Publish/replace cubeshelf-nightly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view cubeshelf-nightly >/dev/null 2>&1; then
            gh release delete cubeshelf-nightly --yes --cleanup-tag
          fi

          gh release create cubeshelf-nightly \
            release/PartyBoard-win-x64.zip \
            release/PartyBoard-linux-x64.AppImage \
            release/PartyBoard-macos-arm64.zip \
            release/PartyBoard-macos-x64.zip \
            release/manifest.json \
            release/checksums.txt \
            release/release-notes.txt \
            --target "${{ github.sha }}" \
            --title "CubeShelf Nightly - PartyBoard Desktop" \
            --notes-file release/release-notes.txt \
            --prerelease
