name: CubeShelf Windows Release

# Releases come from a deliberate act, never from a branch push.
#
# This workflow used to trigger on every push to audio-local and its only gate
# was that the build succeeded. That contradicts the project's first rule -
# "ca compile" is never "ca fonctionne" - and it meant a work-in-progress commit
# published a public artifact. Publishing is now a tag, or a hand-pressed
# button.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cubeshelf-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and publish PartyBoard Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply PartyBoard dependency patches
        shell: pwsh
        run: |
          git -C extern/musyx apply --check ../../patches/musyx-partyboard.patch
          git -C extern/musyx apply ../../patches/musyx-partyboard.patch
          git -C extern/aurora apply --check ../../patches/aurora-partyboard.patch
          git -C extern/aurora apply ../../patches/aurora-partyboard.patch

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Override VCPKG_ROOT
        shell: pwsh
        run: |
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install ninja -y
          vcpkg install freetype:x64-windows-static zstd:x64-windows-static

      - name: Configure CMake
        shell: pwsh
        # The default desktop backend is deliberately silent.  CubeShelf must
        # ship the same MusyX-backed configuration as the tested Windows build.
        run: cmake --preset x-windows-ci-msvc -DPARTYBOARD_EXPERIMENTAL_MUSYX_AUDIO=ON

      - name: Validate audio configuration
        shell: pwsh
        run: |
          $audio = Select-String -Path "build/x-windows-ci-msvc/CMakeCache.txt" `
            -Pattern '^PARTYBOARD_EXPERIMENTAL_MUSYX_AUDIO:BOOL=ON$'
          if (-not $audio) {
            throw "CubeShelf build was configured with the silent audio backend."
          }

      - name: Build
        shell: pwsh
        run: cmake --build --preset x-windows-ci-msvc

      - name: Build online launcher
        shell: pwsh
        run: |
          ./tools/build_online.ps1 -OutputDirectory "build/install"
          Copy-Item -LiteralPath "tools/package/Jouer en ligne.cmd" -Destination "build/install" -Force
          Copy-Item -LiteralPath "tools/package/Lancer PartyBoard.cmd" -Destination "build/install" -Force

      - name: Validate runtime
        shell: pwsh
        run: |
          $required = @(
            "partyboard.exe",
            "PartyBoardOnline.exe",
            "PartyBoardOnline.exe.config",
            "Jouer en ligne.cmd",
            "Lancer PartyBoard.cmd"
          )

          foreach ($file in $required) {
            $path = Join-Path "build/install" $file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "$file was not produced under build/install."
            }
          }

          $test = Start-Process -FilePath "build/install/PartyBoardOnline.exe" `
            -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($test.ExitCode -ne 0) {
            throw "PartyBoardOnline self-test failed with exit code $($test.ExitCode)."
          }

          Write-Host "Offline and online launchers are ready."

      - name: Engine self-tests
        shell: pwsh
        # The launcher self-test was, until now, the only thing between a build
        # and a public download. The engine carries eight self-tests of its own -
        # rollback, transport, netplay runtime, crash reporter, heap detector,
        # audio lifetime, crash manifest, crash uploader - and none of them ran
        # here. They need no disc and no network.
        run: |
          $ErrorActionPreference = "Stop"
          $log = & "build/install/partyboard.exe" "--netplay-self-test" 2>&1
          $code = $LASTEXITCODE
          $log | ForEach-Object { Write-Host $_ }

          $summary = $log | Where-Object { $_ -match '^SELFTEST total=' } | Select-Object -Last 1
          if (-not $summary) {
            throw "The engine self-test produced no summary line; it did not run to the end."
          }
          if ($summary -notmatch 'total=(\d+) failed=(\d+)') {
            throw "Unreadable self-test summary: $summary"
          }
          $total = [int]$Matches[1]
          $failed = [int]$Matches[2]

          # A gate that cannot say how many checks ran is not a gate: if a
          # component is ever removed from the chain this step has to notice.
          if ($total -ne 8) {
            throw "Expected 8 engine self-tests, the binary ran $total."
          }
          if ($failed -ne 0 -or $code -ne 0) {
            throw "$failed of $total engine self-tests failed (exit code $code)."
          }
          Write-Host "All $total engine self-tests passed."

      - name: Test suite
        shell: pwsh
        # The scripts that need no disc image. This is the second half of the
        # release gate: the engine self-tests say the binary's own components
        # work, and these say the harness around it does - snapshot restore, PAD
        # ticks, the crash pipeline, the rollback suites, the merge fixtures, the
        # update channel guard.
        #
        # test_netplay_boot is excluded because it needs a real disc, which a CI
        # runner does not have. test_direct_connection is excluded deliberately
        # and permanently: it probes the router and can open a port, which must
        # never happen unattended on a shared machine.
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/run_all_tests.ps1 `
            -BinaryDirectory "build/install" `
            -Exclude test_direct_connection
          if ($LASTEXITCODE -ne 0) {
            throw "The test suite failed with exit code $LASTEXITCODE."
          }

      - name: Create CubeShelf package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = "PartyBoard-win-x64.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "build/install/*" -DestinationPath $zip -Force

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "checksums.txt" -Encoding ascii

          $shortSha = "${{ github.sha }}".Substring(0, 12)
          $changes = (git log -5 --pretty=format:"%h %s") -join "`n"

          $manifest = [ordered]@{
            schema = 1
            game = "Mario Party 4"
            gameId = "GMPE01_00"
            version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-$shortSha" }
            commit = "${{ github.sha }}"
            ref = "${{ github.ref_name }}"
            refType = "${{ github.ref_type }}"
            runId = "${{ github.run_id }}"
            runNumber = "${{ github.run_number }}"
            platform = "win-x64"
            executable = "partyboard.exe"
            supportedDiscs = @(
              "GMPE01_00",
              "GMPE01_01"
            )
            changes = $changes
          } | ConvertTo-Json -Depth 6

          Set-Content "manifest.json" -Value $manifest -Encoding utf8

          @"
          CubeShelf automatic Windows build

          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          Recent changes:
          $changes
          "@ | Set-Content "release-notes.txt" -Encoding utf8

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: PartyBoard-win-x64-${{ github.sha }}
          path: |
            PartyBoard-win-x64.zip
            manifest.json
            checksums.txt
            release-notes.txt
          retention-days: 14

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release keeps its own tag, and no published artifact is ever
          # deleted. The previous version replaced a single rolling
          # "cubeshelf-nightly" release on each run, which left no download URL
          # that stayed valid and nothing to bisect when a tester reported a
          # crash against a build that no longer existed.
          $shortSha = "${{ github.sha }}".Substring(0, 12)
          $releaseTag = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "dev-$shortSha"
          }

          $ErrorActionPreference = "Continue"
          gh release view $releaseTag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if ($exists) {
            # A re-run of the same commit refreshes its own assets; it does not
            # touch anyone else's release.
            gh release upload $releaseTag `
              "PartyBoard-win-x64.zip" `
              "manifest.json" `
              "checksums.txt" `
              "release-notes.txt" `
              --clobber
          } else {
            gh release create $releaseTag `
              "PartyBoard-win-x64.zip" `
              "manifest.json" `
              "checksums.txt" `
              "release-notes.txt" `
              --target "${{ github.sha }}" `
              --title "PartyBoard Windows - $releaseTag" `
              --notes-file "release-notes.txt" `
              --prerelease
          }
