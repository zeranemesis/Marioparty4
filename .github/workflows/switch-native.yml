name: Switch native bring-up

on:
  push:
    branches:
      - switch-native-bootstrap
    paths:
      - ".github/workflows/switch-native.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "platforms/switch/**"
      - "extern/aurora"
  pull_request:
    paths:
      - ".github/workflows/switch-native.yml"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "platforms/switch/**"
  workflow_dispatch:

concurrency:
  group: switch-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: libnx bootstrap
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply PartyBoard Aurora patches
        shell: bash
        run: |
          git -C extern/aurora apply --check ../../patches/aurora-partyboard.patch
          git -C extern/aurora apply ../../patches/aurora-partyboard.patch
          git -C extern/aurora apply --check ../../patches/aurora-render-fixes.patch
          git -C extern/aurora apply ../../patches/aurora-render-fixes.patch
          git -C extern/aurora apply --check ../../patches/aurora-android-surface-deadlock.patch
          git -C extern/aurora apply ../../patches/aurora-android-surface-deadlock.patch
          git -C extern/aurora apply --check ../../patches/aurora-mobile-one-local-player.patch
          git -C extern/aurora apply ../../patches/aurora-mobile-one-local-player.patch
          git -C extern/aurora apply --check ../../patches/aurora-render-worker-idle.patch
          git -C extern/aurora apply ../../patches/aurora-render-worker-idle.patch
          git -C extern/aurora apply --check ../../patches/aurora-quest-stereo.patch
          git -C extern/aurora apply ../../patches/aurora-quest-stereo.patch
          git -C extern/aurora apply --check ../../patches/aurora-android-surface-generation.patch
          git -C extern/aurora apply ../../patches/aurora-android-surface-generation.patch
          git -C extern/aurora apply --check ../../patches/aurora-quest-quality.patch
          git -C extern/aurora apply ../../patches/aurora-quest-quality.patch

      - name: Toolchain info
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-g++" --version
          cmake --version
          ninja --version
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: cmake --preset switch-libnx-bootstrap

      - name: Build NRO
        run: cmake --build build/switch-libnx-bootstrap --target partyboard_switch_nro --parallel 2

      - name: Build launcher NRO
        run: cmake --build build/switch-libnx-bootstrap --target partyboard_switch_launcher_nro --parallel 2

      - name: Inspect output
        run: |
          ls -lh build/switch-libnx-bootstrap/platforms/switch/partyboard-switch-probe.*
          file build/switch-libnx-bootstrap/platforms/switch/partyboard-switch-probe.elf || true
          ls -lh build/switch-libnx-bootstrap/platforms/switch/launcher/partyboard-launcher.*

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: partyboard-switch-probe
          path: |
            build/switch-libnx-bootstrap/platforms/switch/partyboard-switch-probe.nro
            build/switch-libnx-bootstrap/platforms/switch/partyboard-switch-probe.elf
          if-no-files-found: error

      - name: Upload launcher NRO
        uses: actions/upload-artifact@v4
        with:
          name: partyboard-switch-launcher
          path: |
            build/switch-libnx-bootstrap/platforms/switch/launcher/partyboard-launcher.nro
            build/switch-libnx-bootstrap/platforms/switch/launcher/partyboard-launcher.elf
          if-no-files-found: error

  launcher-host:
    name: Launcher tests and screenshots
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libegl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri \
            libfreetype-dev libpng-dev zlib1g-dev libbz2-dev libzstd-dev

      - name: Build
        run: |
          cmake -S platforms/switch/launcher -B build/launcher-host -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/launcher-host --parallel 2

      - name: Unit tests
        run: ctest --test-dir build/launcher-host --output-on-failure

      - name: Render screenshots
        run: platforms/switch/launcher/tools/render-previews.sh build/launcher-host build/launcher-screens

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: partyboard-switch-launcher-screens
          path: build/launcher-screens/*.png
          if-no-files-found: error

  nodlite:
    name: nodlite tests (and against nod)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libbz2-dev libzstd-dev liblzma-dev

      - name: Build
        run: |
          cmake -S platforms/switch/nodlite -B build/nodlite -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build/nodlite --parallel 2

      - name: Unit tests
        run: ctest --test-dir build/nodlite --output-on-failure

      # The same suite linked against the real nod (built with cargo), so
      # nodlite keeps nod's behaviour, not just its own.
      - name: Tests against nod
        run: platforms/switch/nodlite/tools/check-against-nod.sh

  sdl3-probe:
    name: SDL3 libnx probe
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare container git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure SDL3 probe
        run: cmake --preset switch-libnx-sdl3-probe

      - name: Build SDL3 and the probe NRO
        run: cmake --build build/switch-libnx-sdl3-probe --target partyboard_switch_sdl3_nro --parallel 2

      - name: Upload SDL3 probe
        uses: actions/upload-artifact@v4
        with:
          name: partyboard-switch-sdl3-probe
          path: |
            build/switch-libnx-sdl3-probe/platforms/switch/partyboard-switch-sdl3-probe.nro
            build/switch-libnx-sdl3-probe/platforms/switch/partyboard-switch-sdl3-probe.elf
          if-no-files-found: error

  dawn-probe:
    name: Dawn OpenGLES probe
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: devkitpro/devkita64:20260219

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply PartyBoard Aurora patches
        shell: bash
        run: |
          git -C extern/aurora apply --check ../../patches/aurora-partyboard.patch
          git -C extern/aurora apply ../../patches/aurora-partyboard.patch
          git -C extern/aurora apply --check ../../patches/aurora-render-fixes.patch
          git -C extern/aurora apply ../../patches/aurora-render-fixes.patch
          git -C extern/aurora apply --check ../../patches/aurora-android-surface-deadlock.patch
          git -C extern/aurora apply ../../patches/aurora-android-surface-deadlock.patch
          git -C extern/aurora apply --check ../../patches/aurora-mobile-one-local-player.patch
          git -C extern/aurora apply ../../patches/aurora-mobile-one-local-player.patch
          git -C extern/aurora apply --check ../../patches/aurora-render-worker-idle.patch
          git -C extern/aurora apply ../../patches/aurora-render-worker-idle.patch
          git -C extern/aurora apply --check ../../patches/aurora-quest-stereo.patch
          git -C extern/aurora apply ../../patches/aurora-quest-stereo.patch
          git -C extern/aurora apply --check ../../patches/aurora-android-surface-generation.patch
          git -C extern/aurora apply ../../patches/aurora-android-surface-generation.patch
          git -C extern/aurora apply --check ../../patches/aurora-quest-quality.patch
          git -C extern/aurora apply ../../patches/aurora-quest-quality.patch

      - name: Prepare container git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure Dawn probe
        run: cmake --preset switch-libnx-dawn-probe

      - name: Build Dawn probe NRO
        run: cmake --build build/switch-libnx-dawn-probe --target partyboard_switch_dawn_nro --parallel 2

      - name: Upload Dawn probe
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: partyboard-switch-dawn-probe
          path: |
            build/switch-libnx-dawn-probe/platforms/switch/partyboard-switch-dawn-probe.nro
            build/switch-libnx-dawn-probe/platforms/switch/partyboard-switch-dawn-probe.elf
          if-no-files-found: error
